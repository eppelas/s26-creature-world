<meta charset="utf-8">
<title>Мир существ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=JetBrains+Mono:wght@400&display=swap">

<style>
  :root {
    --paper: #ffffff; --surface: #f7f6f3; --ink: #171717; --ink2: #63605a; --ink3: #918d85;
    --line: #e3e1da; --red: #dc2626; --dim: #b9b4aa;
    --display: "Golos Text", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#121110; --surface:#1b1917; --ink:#efece6; --ink2:#a09b91; --ink3:#78736a;
            --line:#2c2925; --red:#f05a4e; --dim:#4d4941; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--display); }
  .rule { height: 3px; background: var(--line); position: relative; }
  .rule::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 21%; background: var(--red); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(1.2rem, 4vw, 3rem) 5rem; }
  header { padding: clamp(2.5rem, 6vw, 4rem) 0 2rem; }
  .eyebrow { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em;
             text-transform: uppercase; color: var(--red); margin: 0; }
  h1 { font-weight: 900; font-size: clamp(2.6rem, 8vw, 5rem); line-height: .9;
       letter-spacing: -.03em; margin: .3em 0 0; }
  .lead { color: var(--ink2); max-width: 34em; margin: 1em 0 0; font-size: 1.05rem; line-height: 1.55; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
           gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 2rem; }
  .tile { background: var(--surface); padding: .8rem 1rem; }
  .tile b { display: block; font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile span { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 2.5rem; }
  .cell { background: var(--surface); padding-bottom: .9rem; }
  .cell canvas { display: block; width: 100%; }
  .cap { padding: .6rem .9rem 0; }
  .cap b { display: block; font-size: .95rem; letter-spacing: -.01em; }
  .cap .sp { display: block; font-size: .78rem; color: var(--ink2); margin-top: .1rem; }
  .cap .st { display: block; font-family: var(--mono); font-size: .68rem; color: var(--ink3);
             letter-spacing: .05em; margin-top: .35rem; }
  .cap .st.warn { color: var(--red); }
  footer { margin-top: 3rem; font-family: var(--mono); font-size: .7rem; color: var(--ink3);
           letter-spacing: .05em; }
  .empty { padding: 3rem 0; color: var(--ink3); }
</style>

<div class="rule"></div>
<div class="wrap">
  <header>
    <p class="eyebrow">S26 · мир существ</p>
    <h1>Кто<br>завёлся</h1>
    <p class="lead">Каждое существо живёт в пространстве чьего-то проекта. Пока хозяин приходит — растёт. Пропадёт надолго — тускнеет, осыпается и уходит контуром.</p>
    <div class="tiles" id="tiles"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div>

<script src="creature.js"></script>
<script src="space.js"></script>
<script src="voxel-canvas.js"></script>
<script>
(function () {
  'use strict';

  var grid = document.getElementById('grid');
  var tiles = document.getElementById('tiles');
  var foot = document.getElementById('foot');
  var scenes = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render(world) {
    var list = world.creatures || [];
    if (!list.length) {
      grid.innerHTML = '<p class="empty">Пока пусто. Первое существо вот-вот вылупится.</p>';
      return;
    }

    /* впереди те, кому внимание нужно прямо сейчас */
    list.sort(function (a, b) { return (a.v - b.v) || (b.at - a.at); });

    var alive = list.filter(function (c) { return c.v > 0.5; }).length;
    var fading = list.filter(function (c) { return c.v <= 0.5 && c.v > 0.06; }).length;
    var gone = list.filter(function (c) { return c.v <= 0.06; }).length;
    tiles.innerHTML =
      '<div class="tile"><b>' + list.length + '</b><span>всего</span></div>' +
      '<div class="tile"><b>' + alive + '</b><span>в порядке</span></div>' +
      '<div class="tile"><b>' + fading + '</b><span>нужно внимание</span></div>' +
      '<div class="tile"><b>' + gone + '</b><span>улетели</span></div>';

    grid.innerHTML = '';
    list.forEach(function (c) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var cv = document.createElement('canvas');
      var cap = document.createElement('div');
      cap.className = 'cap';
      var warn = c.v <= 0.62;
      cap.innerHTML =
        '<b>' + esc(c.n) + '</b>' +
        '<span class="sp">' + esc(c.sp) + '</span>' +
        '<span class="st' + (warn ? ' warn' : '') + '">' + esc(c.stName) + ' · ' + esc(c.fade) +
        (c.days ? ' · ' + c.days + ' дн. без внимания' : '') + '</span>';
      cell.appendChild(cv);
      cell.appendChild(cap);
      grid.appendChild(cell);

      var genome = { body: c.g[0], legs: c.g[1], ant: c.g[2], eye: c.g[3], pal: c.g[4], tempo: c.g[5] };
      var traits = Creature.deriveTraits(genome, c.s);
      var scene = VoxelCanvas.makeScene(cv, {
        genome: genome, traits: traits, stage: c.st, vitality: c.v, project: c.p || {}
      }, { ratio: 0.62 });
      scenes.push({ scene: scene, el: cell, visible: true });
    });

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var s = scenes.find(function (x) { return x.el === e.target; });
          if (s) s.visible = e.isIntersecting;
        });
      }, { rootMargin: '120px' });
      scenes.forEach(function (s) { io.observe(s.el); });
    }

    var when = new Date(world.updated || Date.now());
    foot.textContent = 'обновлено ' + when.toLocaleString('ru-RU');
  }

  /* Кадры режем до 15 в секунду: карточек может быть много, красоты это не портит */
  var last = 0;
  function loop(now) {
    if (now - last > 66) {
      last = now;
      for (var i = 0; i < scenes.length; i++) if (scenes[i].visible) scenes[i].scene.frame(now, 0);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  fetch('world.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () {
      grid.innerHTML = '<p class="empty">Мир пока не выложен.</p>';
    });

  setInterval(function () {
    fetch('world.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (w) { scenes = []; render(w); })
      .catch(function () {});
  }, 120000);
})();
</script>
